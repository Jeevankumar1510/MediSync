services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medisync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisync_password}
      POSTGRES_DB: ${POSTGRES_DB:-medisync_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medisync_user} -d ${POSTGRES_DB:-medisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medisync-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

